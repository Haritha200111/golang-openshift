apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: go-ci
spec:
  description: Validate and build the Go application.
  workspaces:
    - name: source
  steps:
    - name: validate
      image: golang:1.23.4
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "Checking Go formatting..."
        UNFORMATTED="$(gofmt -l .)"
        if [ -n "$UNFORMATTED" ]; then
          echo "These files need gofmt:"
          echo "$UNFORMATTED"
          exit 1
        fi

        echo "Running go vet..."
        go vet ./...

        echo "Running Go tests..."
        go test ./...

        echo "Building Go application..."
        go build -buildvcs=false -trimpath -o /tmp/task-api .

        echo "Go validation and build completed successfully."